server:
  port: 8079
  contextPath: myapp

com:
  kmr:
    config: admin

pageSize: 10
dbName: oracle

spring:
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Actuator - expose only safe endpoints for production
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"
  endpoint:
    health:
      show-details: when-authorized
    shutdown:
      enabled: false


info:
  app:
    name: Job Application Portal
    description: Spring Boot REST API
    version: 1.0.0
