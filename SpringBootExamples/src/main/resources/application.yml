server:
  port: 8079
  contextPath: myapp

com:
  kmr:
    config: admin

pageSize: 10
dbName: oracle

spring:
  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:testdb
    # url: jdbc:h2:file:./data/testdb  # For development and unit testing, mem mode is most commonly used.
    driverClassName: org.h2.Driver
    username: sa
    password:

  # Enable H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

info:
  app:
    name: Job Application Portal
    description: Spring Boot REST API
    version: 1.0.0
